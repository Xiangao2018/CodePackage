<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <p><strong> 文本加粗标签 </strong> </p>
    <p><b> 这也是加粗标签 </b></p>


    <p><em>这是倾斜标签</em></p>
    <p><i>这是倾斜标签</i></p>


    <p><del>这是删除标签</del></p>
    <p><s>这是删除标签</s></p>


    <p><ins>这是下划线标签</ins></p>
    <p><u>这是下划线标签</u></p>


</body>

</html>
