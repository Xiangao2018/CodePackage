</body>

<h4> 图像标签的使用：</h4>

<div> <img src="./imgs/image.png" /></div>

<h4> alt 替换文本</h4>

<div><img src="./imgs/image1.png" alt="alt 替换文本" /></div>

<h4> title 鼠标移动上去显示的内容</h4>

<img src="./imgs/image.png" title="美女" />

<h4> width 和 height 设置高度</h4>

<img src="./imgs/image.png" title="美女" width="100" />
<img src="./imgs/image.png" title="美女" height="100" />

<h4> border 设置边框</h4>
<img src="./imgs/image.png" title="美女" height="100" border="15" />

</html>
