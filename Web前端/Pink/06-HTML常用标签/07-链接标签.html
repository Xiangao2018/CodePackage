<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接标签</title>
</head>

<body>

    <h4> 1. 外部链接 </h4>
    <a href="https://www.youtube.com/" target="_blank"> Youtube (target=_blank))</a> <br />
    <a href="https://www.google.com/" target="_self"> Google (target=_self))</a>


    <h4> 2. 内部链接：网站内部页面之间的相互连接 </h4>
    <a href="./01-标题标签.html" target="_blank"> 标题标签 </a> <br />
    <a href="./02-段落标签.html" target="_blank"> 段落标签 </a> <br />
    <a href="./03-课堂案例：体育新闻.html" target="_blank"> 课堂案例：体育新闻</a> <br />

    <h4> 3. 空链接 # </h4>
    <a href="#">空链接 # </a> <br />

    <h4> 4. 下载链接：地址是克制下文件或者zip等压缩包形式</h4>
    <a href="./imgs.zip">下载 imgs.zip，会自动下载 </a> <br />

    <h4> 5. 网页中的各种元素都可以添加超链接 </h4>
    <a href="https://www.youtube.com"> <img src="./imgs/image.png"></a> <br />

</body>

</html>
